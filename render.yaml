# Render Blueprint: one free Docker web service.
services:
  - type: web
    name: voice-crm-agent
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/nguyenduykhoa2601/voice-crm-agent
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-3.1-flash-live-preview
      - key: RENDER
        value: "1"
      - key: MAX_SESSIONS
        value: "1"
      - key: LOW_MEMORY
        value: "1"
      - key: HEADLESS
        value: "1"
